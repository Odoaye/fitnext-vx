kind = "web"
previewPath = "/"
title = "XcelLearn 1.1"
description = "A polished academic learning platform for students, lecturers, and administrators to manage courses, assignments, submissions, and institutional activity in one focused workspace."
version = "1.0.0"
id = "artifacts/xcellearn-next"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24998

[services.development]
run = "pnpm --filter @workspace/xcellearn-next run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xcellearn-next", "run", "build" ]
serve = "static"
publicDir = "artifacts/xcellearn-next/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24998"
BASE_PATH = "/"
